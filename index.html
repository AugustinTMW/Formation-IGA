  const view = UI2.view;
  X2.world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.z + ')';
  X2.canvas.style.backgroundSize = (GRID * view.z) + 'px ' + (GRID * view.z) + 'px';
  X2.canvas.style.backgroundPosition = view.x + 'px ' + view.y + 'px';
  $('#x2-zoom').textContent = Math.round(view.z * 100) + '%';
  S2.view = Object.assign({}, view);
  clearTimeout(x2ViewTimer); x2ViewTimer = setTimeout(x2Save, 300);
}
function x2Content() { return { w: X2.cols.offsetWidth, h: X2.cols.offsetHeight }; }
/* minZ: lowest zoom accepted. Automatic fit keeps the text readable (50 %, the
   view is then aligned to the top); the Focus button shows everything. */
function x2FitView(minZ) {
  const b = x2Content(), r = X2.canvas.getBoundingClientRect(), pad = 40;
  const z = clamp(Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2 - 50) / b.h), minZ || 0.5, 1);
  x2ApplyView({ z, x: (r.width - b.w * z) / 2, y: pad });
}
function x2ResetView() {
  const b = x2Content(), r = X2.canvas.getBoundingClientRect();
  const z = r.width < b.w + 48 ? clamp((r.width - 32) / b.w, 0.35, 1) : 1;
  x2ApplyView({ z, x: Math.max(16, (r.width - b.w * z) / 2), y: 24 });
}
function x2ZoomAt(f, px, py) {
  const r = X2.canvas.getBoundingClientRect(), v = UI2.view;
  if (px == null) { px = r.width / 2; py = r.height / 2; }
  const nz = clamp(v.z * f, 0.3, 2), wx = (px - v.x) / v.z, wy = (py - v.y) / v.z;
  x2ApplyView({ z: nz, x: px - wx * nz, y: py - wy * nz });
}
function x2ToWorld(ev) {
  const r = X2.canvas.getBoundingClientRect(), v = UI2.view;
  return { x: (ev.clientX - r.left - v.x) / v.z, y: (ev.clientY - r.top - v.y) / v.z, cx: ev.clientX - r.left, cy: ev.clientY - r.top };
}

/* ---------- Moving cards ---------- */
function x2Move(id, to, index) {
  const fromCol = x2ColOf(id);
  const src = x2ListOf(fromCol);
  src.splice(src.indexOf(id), 1);
  const dst = x2ListOf(to);
  dst.splice(index == null ? dst.length : clamp(index, 0, dst.length), 0, id);
  let removed = 0;
  if (fromCol !== to) {
    delete S2.marks[id];
    if (to === 'tray') { const n = S2.rels.length; S2.rels = S2.rels.filter(r => r.from !== id && r.to !== id); removed = n - S2.rels.length; }
    removed += x2PruneRels();
    if (UI2.selected === id && to === 'tray') UI2.selected = null;
  }
  if (fromCol !== to) S2.solved = false;
  x2Save();
  x2Render();
  const el = document.querySelector('[data-card="' + id + '"]');
  if (el) { el.classList.add('just-dropped'); el.focus({ preventScroll: true }); }
  if (removed) toast(removed + ' relationship' + (removed > 1 ? 's' : '') + ' removed because the item changed category.');
}
/** Tidy up: reorder items to limit crossing arrows, keeping categories and relationships. */
function x2Tidy() {
  const pos = list => { const m = {}; list.forEach((id, i) => { m[id] = i; }); return m; };
  const sortBy = (list, score) => list.map((id, i) => ({ id, i, s: score(id) })).sort((a, b) => (a.s - b.s) || (a.i - b.i)).map(x => x.id);
  const bary = (id, ids, idx, dir) => {
    const ns = S2.rels.filter(r => dir === 'in' ? r.to === id : r.from === id).map(r => idx[dir === 'in' ? r.from : r.to]).filter(v => v != null);
    return ns.length ? ns.reduce((a, b) => a + b, 0) / ns.length : Infinity;
  };
  for (let pass = 0; pass < 2; pass++) {
    const pa = pos(S2.cols.actor);
    S2.cols.activity = sortBy(S2.cols.activity, id => bary(id, null, pa, 'in'));
    const pc = pos(S2.cols.activity);
    S2.cols.right = sortBy(S2.cols.right, id => bary(id, null, pc, 'in'));
    S2.cols.actor = sortBy(S2.cols.actor, id => bary(id, null, pc, 'out'));
  }
  const pa = pos(S2.cols.actor);
  S2.cols.activity = sortBy(S2.cols.activity, id => bary(id, null, pa, 'in'));
  const pc = pos(S2.cols.activity);
  S2.cols.right = sortBy(S2.cols.right, id => bary(id, null, pc, 'in'));
  x2Save(); x2Render();   // the zoom level and position are kept
  toast('Items tidied up. Categories and relationships are unchanged.');
}

/* ---------- Pointer interactions ---------- */
function x2Bind() {
  const root = X2.root;
  let drag = null;

  const dropZoneAt = ev => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    if (el && el.closest('#x2-tray')) return 'tray';
    const r = X2.canvas.getBoundingClientRect();
    if (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) return null;
    if (el && el.closest('.canvas-controls')) return null;
    const p = x2ToWorld(ev);
    let best = null, bestD = Infinity;
    $$('.x2-col', X2.cols).forEach(c => {
      const cx = c.offsetLeft + c.offsetWidth / 2, d = Math.abs(p.x - cx);
      if (d < bestD) { bestD = d; best = c.dataset.col; }
    });
    return best;
  };
  const placeholderIndex = (zone, ev) => {
    if (zone === 'tray') {
      const chips = $$('#x2-tray-list .x2-card').filter(c => c.dataset.card !== drag.id);
      for (let i = 0; i < chips.length; i++) {
        const r = chips[i].getBoundingClientRect();
        if (ev.clientY < r.top || (ev.clientY <= r.bottom && ev.clientX < r.left + r.width / 2)) return i;
      }
      return chips.length;
    }
    const p = x2ToWorld(ev);
    const cards = $$('.x2-col[data-col="' + zone + '"] .x2-card').filter(c => c.dataset.card !== drag.id);
    for (let i = 0; i < cards.length; i++) { const r = x2WorldRect(cards[i]); if (p.y < r.y + r.h / 2) return i; }
    return cards.length;
  };
  const showPlaceholder = (zone, index) => {
    if (drag.zone === zone && drag.index === index) return;
    $$('.is-drop-target', root).forEach(e => e.classList.remove('is-drop-target'));
    if (drag.ph) drag.ph.remove();
    drag.zone = zone; drag.index = index;
    if (!zone) { x2DrawRels(); return; }
    const box = zone === 'tray' ? $('#x2-tray') : $('.x2-col[data-col="' + zone + '"]', X2.cols);
    box.classList.add('is-drop-target');
    const list = zone === 'tray' ? $('#x2-tray-list') : $('.x2-col-list', box);
    $$('.x2-col-empty, .x2-tray-empty', list).forEach(e => { e.hidden = true; });
    const ph = document.createElement('div');
    ph.className = 'x2-ph' + (zone === 'tray' ? ' x2-ph--chip' : '');
    if (zone !== 'tray') ph.style.height = drag.h + 'px';
    const items = $$('.x2-card', list).filter(c => c.dataset.card !== drag.id);
    list.insertBefore(ph, items[index] || null);
    drag.ph = ph;
    x2DrawRels();
  };
  const endCardDrag = commit => {
    const d = drag; drag = null;
    if (d.ghost) d.ghost.remove();
    if (d.ph) d.ph.remove();
    $$('.is-drop-target', root).forEach(e => e.classList.remove('is-drop-target'));
    if (commit && d.zone) x2Move(d.id, d.zone, d.index);
    else x2Render();
  };
  const linkTarget = (ev, from) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const card = el && el.closest ? el.closest('.x2-col [data-card]') : null;
    if (!card) return { el: null };
    return { el: card, id: card.dataset.card, check: x2CanRelate(from, card.dataset.card, true) };
  };
  const endLink = ev => {
    const d = drag; drag = null;
    if (d.tip) d.tip.remove();
    X2.link.innerHTML = '';
    if (d.hover) d.hover.classList.remove('is-drop-ok', 'is-drop-bad');
    UI2.selected = d.prevSel;
    if (!ev) { x2Render(); return; }
    const t = linkTarget(ev, d.from);
    if (t.el && t.check.ok) {
      x2AddRel(t.check.from, t.check.to);
      S2.solved = false; x2Save(); x2Render();
      toast('Relationship added: ' + x2Label(t.check.from) + ' → ' + x2Label(t.check.to) + '.', 'success');
    } else {
      if (t.el && t.id !== d.from) toast(t.check.reason, 'error');
      x2Render();
    }
  };

  root.addEventListener('pointerdown', ev => {
    if (ev.button !== 0 || dlg.open) return;
    const port = ev.target.closest('[data-x2-port]');
    const cardEl = ev.target.closest('[data-card]');
    if (UI2.checking) { if (!ev.target.closest('.x2-canvas') || cardEl || port) return; }
    if (port) {
      ev.preventDefault();
      drag = { kind: 'link', from: port.dataset.x2Port, el: port, sx: ev.clientX, sy: ev.clientY, moved: false, prevSel: UI2.selected };
      root.setPointerCapture(ev.pointerId); return;
    }
    if (cardEl) {
      const r = cardEl.getBoundingClientRect();
      drag = { kind: 'card', id: cardEl.dataset.card, el: cardEl, sx: ev.clientX, sy: ev.clientY, moved: false,
        ox: ev.clientX - r.left, oy: ev.clientY - r.top, w: cardEl.offsetWidth, h: cardEl.offsetHeight, zone: undefined, index: undefined };
      root.setPointerCapture(ev.pointerId); return;
    }
    if (ev.target.closest('button, a, input, select, details, .canvas-controls, .canvas-hint')) return;
    if (ev.target.closest('.x2-canvas')) {
      drag = { kind: 'pan', sx: ev.clientX, sy: ev.clientY, ox: UI2.view.x, oy: UI2.view.y, moved: false };
      X2.canvas.classList.add('is-panning');
      root.setPointerCapture(ev.pointerId);
    }
  });
  root.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    if (!drag.moved) {
      drag.moved = true;
      if (drag.kind === 'card') {
        const g = drag.el.cloneNode(true);
        g.classList.add('x2-ghost'); g.classList.remove('is-selected', 'is-compatible', 'is-dim', 'is-linked', 'just-dropped');
        g.removeAttribute('data-card'); g.removeAttribute('data-key'); g.removeAttribute('tabindex');
        $$('.x2-port', g).forEach(e => e.remove());
        g.style.width = drag.w + 'px';
        document.body.appendChild(g);
        drag.ghost = g;
        drag.ox = Math.min(drag.ox / (drag.el.closest('.x2-canvas') ? UI2.view.z : 1), drag.w - 10);
        drag.oy = Math.min(drag.oy / (drag.el.closest('.x2-canvas') ? UI2.view.z : 1), drag.h - 6);
        drag.el.classList.add('is-drag-source');
      } else if (drag.kind === 'link') {
        UI2.selected = drag.from; x2RenderCols(); x2DrawRels();
        drag.el = $('[data-x2-port="' + drag.from + '"]', X2.cols);
        if (drag.el) drag.el.classList.add('is-active');
        drag.tip = document.createElement('div'); drag.tip.className = 'link-tip'; X2.canvas.appendChild(drag.tip);
        X2.canvas.classList.add('is-linking');
      }
    }
    if (drag.kind === 'pan') { UI2.autoFit = false; x2ApplyView({ z: UI2.view.z, x: drag.ox + dx, y: drag.oy + dy }); return; }
    if (drag.kind === 'card') {
      drag.ghost.style.left = (ev.clientX - drag.ox) + 'px';
      drag.ghost.style.top = (ev.clientY - drag.oy) + 'px';
      const zone = dropZoneAt(ev);
      showPlaceholder(zone, zone ? placeholderIndex(zone, ev) : null);
      return;
    }
    if (drag.kind === 'link') {
      const p = x2ToWorld(ev), src = x2CardEl(drag.from);
      const r = x2WorldRect(src), x1 = r.x + r.w + 10, y1 = r.y + r.h / 2;
      const t = linkTarget(ev, drag.from);
      if (drag.hover && drag.hover !== t.el) drag.hover.classList.remove('is-drop-ok', 'is-drop-bad');
      drag.hover = t.el;
      let tip = 'Drop on a compatible item (highlighted in green)', cls = '';
      if (t.el && t.id !== drag.from) {
        t.el.classList.toggle('is-drop-ok', t.check.ok); t.el.classList.toggle('is-drop-bad', !t.check.ok);
        tip = t.check.ok ? 'Release to connect to ' + x2Label(t.id) : t.check.reason; cls = t.check.ok ? 'is-ok' : 'is-bad';
      }
      drag.tip.textContent = tip; drag.tip.className = 'link-tip ' + cls;
      drag.tip.style.left = p.cx + 'px'; drag.tip.style.top = p.cy + 'px';
      const ddx = Math.max(40, Math.abs(p.x - x1) / 2);
      X2.link.innerHTML = '<path class="link-preview' + (cls === 'is-bad' ? ' is-bad' : '') + '" d="M' + x1 + ',' + y1 + ' C' + (x1 + ddx) + ',' + y1 + ' ' + (p.x - ddx) + ',' + p.y + ' ' + p.x + ',' + p.y + '" marker-end="url(#x2-arrow-link)"/>';
    }
  });
  const up = ev => {
    if (!drag) return;
    try { root.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    const cancel = ev.type === 'pointercancel';
    if (drag.kind === 'pan') { X2.canvas.classList.remove('is-panning'); const moved = drag.moved; drag = null; if (!moved && UI2.selected) { UI2.selected = null; x2Render(); } return; }
    if (drag.kind === 'card') {
      if (!drag.moved) { const id = drag.id; drag = null; x2Activate(id); return; }
      endCardDrag(!cancel); return;
    }
    if (drag.kind === 'link') {
      X2.canvas.classList.remove('is-linking');
      if (!drag.moved) { const id = drag.from; drag = null; x2Activate(id); return; }
      endLink(cancel ? null : ev);
    }
  };
  root.addEventListener('pointerup', up);
  root.addEventListener('pointercancel', up);

  X2.canvas.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = X2.canvas.getBoundingClientRect();
    UI2.autoFit = false;
    if (ev.ctrlKey || ev.metaKey) x2ZoomAt(Math.exp(-ev.deltaY * 0.0022), ev.clientX - r.left, ev.clientY - r.top);
    else x2ApplyView({ z: UI2.view.z, x: UI2.view.x - ev.deltaX, y: UI2.view.y - ev.deltaY });
  }, { passive: false });

  root.addEventListener('click', async ev => {
    const del = ev.target.closest('[data-rel-del]');
    if (del && !UI2.checking) {
      const r = S2.rels.find(x => x.id === del.dataset.relDel);
      if (r) { S2.rels = S2.rels.filter(x => x !== r); delete S2.verified[r.id]; S2.solved = false; x2Save(); x2Render(UI2.selected ? 'card:' + UI2.selected : null); toast('Relationship removed: ' + x2Label(r.from) + ' → ' + x2Label(r.to) + '.'); }
      return;
    }
    const b = ev.target.closest('[data-x2], [data-act]');
    if (!b || b.disabled) return;
    switch (b.dataset.x2 || b.dataset.act) {
      case 'zoom-in': UI2.autoFit = false; x2ZoomAt(1.2); break;
      case 'zoom-out': UI2.autoFit = false; x2ZoomAt(1 / 1.2); break;
      case 'fit': UI2.autoFit = false; x2FitView(0.3); break;
      case 'reset-view': UI2.autoFit = false; x2ResetView(); break;
      case 'arrange': if (!UI2.checking) x2Tidy(); break;
      case 'deselect': UI2.selected = null; x2Render(); break;
      case 'help': x2ShowHelp(); break;
      case 'check': x2Check(); break;
      case 'reset': {
        const ok = await confirmDialog('Reset exercise', 'Are you sure you want to reset <strong>Exercise 2 – ' + esc(X2.sector.label) + '</strong>? Your classification and all the relationships you created will be deleted. This cannot be undone.', 'Reset exercise', 'danger');
        if (!ok) return;
        S2 = x2Initial(X2.sector); UI2.selected = null;
        x2Save(); x2Render('tb:reset'); UI2.autoFit = true; x2FitView();
        toast('The exercise has been reset.');
        break;
      }
    }
  });
  // Show the × of an arrow when the pointer is close to its middle.
  X2.canvas.addEventListener('pointermove', ev => {
    if (drag || UI2.checking) return;
    const p = x2ToWorld(ev);
    $$('.x2-rel-del', X2.badges).forEach(bt => {
      const near = Math.abs(parseFloat(bt.style.left) - p.x) < 40 && Math.abs(parseFloat(bt.style.top) - p.y) < 22;
      bt.classList.toggle('is-hover', near);
      if (near) bt.style.opacity = 1; else bt.style.opacity = '';
    });
  });

  root.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && UI2.selected && !dlg.open) { UI2.selected = null; x2Render(); return; }
    const cardEl = ev.target.closest && ev.target.closest('[data-card]');
    if (!cardEl || ev.target !== cardEl || UI2.checking) return;
    const id = cardEl.dataset.card, col = x2ColOf(id);
    const keyCols = { '1': 'actor', '2': 'activity', '3': 'right', '0': 'tray' };
    if (keyCols[ev.key] && !ev.altKey && !ev.ctrlKey && !ev.metaKey) {
      ev.preventDefault();
      if (keyCols[ev.key] !== col) {
        x2Move(id, keyCols[ev.key]);
        const k = x2Cats().find(c => c.id === keyCols[ev.key]);
        toast('Moved to ' + (k ? k.short : 'the banner') + '.');
      }
    } else if (ev.altKey && (ev.key === 'ArrowUp' || ev.key === 'ArrowDown')) {
      ev.preventDefault();
      const list = x2ListOf(col), i = list.indexOf(id), j = i + (ev.key === 'ArrowUp' ? -1 : 1);
      if (j >= 0 && j < list.length) x2Move(id, col, j);
    } else if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault(); x2Activate(id);
    }
  });
}
function x2ShowHelp() {
  openDialog({
    title: 'How it works', icon: 'lightbulb', size: 'lg',
    body: '<ul class="x2-help-list">' +
      '<li><strong>Classify:</strong> drag each item from the top banner into one of the three categories. You can move it to another category, reorder it, or drag it back to the banner.</li>' +
      '<li><strong>Connect:</strong> drag the round handle on the right of an item onto a compatible item, or click an item and then click one of the items highlighted in green.</li>' +
      '<li>Allowed relationships: <strong>Actor → Activity</strong> and <strong>Activity → Fine-grained right</strong>. An item can have several relationships.</li>' +
      '<li><strong>Remove a relationship:</strong> select one of its items (or hover the arrow) and click the red ×.</li>' +
      '<li><strong>Check answer</strong> needs at least ' + EX2.minChains + ' complete chains Actor → Activity → Fine-grained right. Correct connections are kept, incorrect ones are removed; you can check as many times as you like.</li>' +
      '<li><strong>View:</strong> zoom in and out, <strong>Focus</strong> to see everything, <strong>Reset view</strong> to go back to 100 %, <strong>Tidy up</strong> to reorder the items and limit crossing arrows.</li>' +
      '<li>Keyboard: <kbd>Tab</kbd> to an item, <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> to place it in a category, <kbd>0</kbd> to send it back to the banner, <kbd>Alt</kbd> + <kbd>↑</kbd>/<kbd>↓</kbd> to reorder, <kbd>Enter</kbd> to select / connect, <kbd>Esc</kbd> to cancel.</li>' +
      '</ul>',
    actions: [{ label: 'Got it', variant: 'primary', submit: true }]
  });
}
/** Click / Enter on a card: select it, or connect it to the selected card. */
function x2Activate(id) {
  if (UI2.checking) return;
  const col = x2ColOf(id);
  if (col === 'tray') { toast('Drag this item into one of the three categories first (or focus it and press 1, 2 or 3).'); return; }
  const sel = UI2.selected;
  if (!sel || sel === id) { UI2.selected = sel === id ? null : id; x2Render('card:' + id); return; }
  const c = x2CanRelate(sel, id);
  if (c.ok) {
    x2AddRel(c.from, c.to);
    S2.solved = false; x2Save(); x2Render('card:' + id);
    toast('Relationship added: ' + x2Label(c.from) + ' → ' + x2Label(c.to) + '.', 'success');
    return;
  }
  UI2.selected = id; x2Render('card:' + id);
}

/* =====================================================================
   17b. WORKSPACE SIZE – the canvas fills the screen below the top part
   (app bar, instruction banner, action bar, notices, Exercise 2 banner)
   so that the whole work area and its controls are visible without
   scrolling. Shared by Exercise 1 (both parts) and Exercise 2.
   ===================================================================== */
const WS_MARGIN = 16, WS_MIN = 380;
function fitWorkspace() {
  const canvas = $('#canvas') || $('#x2-canvas');
  if (!canvas || !canvas.isConnected) return false;
  // side panel first (Exercise 1): it must not push the page down
  const panel = $('#panel');
  if (panel) {
    if (window.matchMedia('(max-width: 1100px)').matches) panel.style.maxHeight = '';
    else {
      const pt = panel.getBoundingClientRect().top + window.scrollY;
      panel.style.maxHeight = Math.max(WS_MIN, Math.floor(window.innerHeight - pt - 24)) + 'px';
    }
  }
  const before = canvas.offsetHeight;
  const cr = canvas.getBoundingClientRect();
  const top = cr.top + window.scrollY;
  // space used under the canvas inside the page (layout padding, panels below it…)
  const below = Math.max(WS_MARGIN, ($('#main').getBoundingClientRect().bottom - cr.bottom));
  canvas.style.height = Math.max(WS_MIN, Math.floor(window.innerHeight - top - below)) + 'px';
  return canvas.offsetHeight !== before;
}
/* Recompute when something above the canvas changes height (notice, long
   instruction, wrapped toolbar…). The view itself is only re-fitted on a
   window resize, so the content does not jump when a notice appears. */
const wsObserver = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => requestAnimationFrame(fitWorkspace)) : null;
function watchWorkspace() {
  if (!wsObserver) return;
  wsObserver.disconnect();
  ['.instruction', '#toolbar', '#notices', '#x2-tray', '#panel'].forEach(sel => { const el = $(sel); if (el) wsObserver.observe(el); });
}
window.addEventListener('resize', () => {
  fitWorkspace();
  if (inExercise() && canvasEl && canvasEl.isConnected) { if (UI.autoFit) fitView(undefined, 0.4); else applyView(); }
  if (X2 && X2.root && X2.root.isConnected) { if (UI2.autoFit) x2FitView(); else x2ApplyView(); x2DrawRels(); }
});

/* =====================================================================
   17. BOOT
   ===================================================================== */
if (!CFG) {
  main.innerHTML = '<div class="fatal"><h1>Configuration missing</h1><p>The file <code>config.js</code> could not be loaded. Make sure it is located next to <code>index.html</code>.</p></div>';
  return;
}
window.addEventListener('hashchange', route);
route();
})();
