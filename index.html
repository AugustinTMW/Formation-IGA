<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Cyber Academy – IGA Workshops</title>
<style>
/* =====================================================================
   DESIGN TOKENS
   ===================================================================== */
:root {
  --primary: #5221b5;
  --primary-600: #47199f;
  --primary-700: #3a1585;
  --primary-800: #2b0f63;
  --primary-50: #f5f0fe;
  --primary-100: #ebe1fc;
  --primary-200: #d6c4f7;
  --ink: #1d1630;
  --ink-2: #3b3550;
  --muted: #5d5873;
  --line: #e4e1ec;
  --line-2: #d3cfdf;
  --bg: #f6f5fa;
  --surface: #ffffff;
  --manual: #1d4ed8;
  --manual-bg: #e8efff;
  --auto: #c81e1e;
  --auto-bg: #fdecec;
  --success: #157f3c;
  --success-bg: #e7f6ec;
  --warning: #9a4a05;
  --warning-bg: #fff4e0;
  --warning-line: #f0b25a;
  --danger: #b91c1c;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(29, 22, 48, .06);
  --shadow: 0 1px 2px rgba(29, 22, 48, .06), 0 6px 16px rgba(29, 22, 48, .07);
  --shadow-lg: 0 10px 40px rgba(29, 22, 48, .18);
  --focus: 0 0 0 3px #fff, 0 0 0 5px var(--primary);
  --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --appbar-h: 60px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
.ico { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: middle; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: none; box-shadow: var(--focus); }
.skip-link {
  position: absolute; left: 12px; top: -48px; z-index: 100;
  background: var(--primary); color: #fff; padding: 8px 14px; border-radius: var(--radius-sm);
  text-decoration: none; font-weight: 600;
}
.skip-link:focus { top: 10px; }

/* =====================================================================
   BUTTONS
   ===================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 16px; border-radius: 10px;
  border: 1px solid transparent; font-weight: 600; font-size: 14px; cursor: pointer;
  transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s, transform .05s;
  white-space: nowrap; text-decoration: none;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { cursor: not-allowed; }
.btn--primary { background: var(--primary); color: #fff; }
.btn--primary:hover:not(:disabled) { background: var(--primary-600); }
.btn--primary:active:not(:disabled) { background: var(--primary-700); }
.btn--primary:disabled { background: #cbc6d8; color: #4a4560; }
.btn--secondary { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
.btn--secondary:hover:not(:disabled) { background: var(--primary-50); border-color: var(--primary-200); color: var(--primary-700); }
.btn--secondary:active:not(:disabled) { background: var(--primary-100); }
.btn--secondary:disabled { color: #8a8599; background: #f3f2f6; }
.btn--ghost { background: transparent; color: var(--ink-2); }
.btn--ghost:hover:not(:disabled) { background: var(--primary-50); color: var(--primary-700); }
.btn--danger { background: var(--danger); color: #fff; }
.btn--danger:hover:not(:disabled) { background: #991b1b; }
.btn--success { background: var(--success); color: #fff; }
.btn--success:hover:not(:disabled) { background: #106430; }
.btn--sm { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;
  background: transparent; color: var(--ink-2); cursor: pointer; padding: 0;
  transition: background-color .15s, color .15s;
}
.icon-btn:hover:not(:disabled) { background: var(--primary-50); color: var(--primary-700); }
.icon-btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn--danger:hover:not(:disabled) { background: #fdecec; color: var(--danger); }

/* =====================================================================
   APP BAR
   ===================================================================== */
.appbar {
  height: var(--appbar-h); background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; padding: 0 24px; position: sticky; top: 0; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; border-radius: 8px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-800) 100%); color: #fff;
}
.brand-mark .ico { width: 19px; height: 19px; }
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: .01em; }
.brand-sub { font-size: 12px; color: var(--muted); display: block; line-height: 1.2; }
.appbar-crumb { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.appbar-crumb strong { color: var(--ink); font-weight: 600; }

/* =====================================================================
   HOME
   ===================================================================== */
.home { max-width: 1120px; margin: 0 auto; padding: 48px 24px 64px; }
.home-hero {
  background: linear-gradient(120deg, var(--primary-800) 0%, var(--primary) 70%, #6d3ad6 100%);
  color: #fff; border-radius: var(--radius-lg); padding: 40px 44px; position: relative; overflow: hidden;
  box-shadow: var(--shadow);
}
.home-hero::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 280px; height: 280px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 70%);
}
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.home-hero .eyebrow { color: #e3d6ff; }
.home-hero h1 { font-size: 32px; line-height: 1.2; margin-top: 8px; font-weight: 700; }
.home-hero p.lead { margin-top: 12px; max-width: 640px; color: #f1eaff; font-size: 16px; }
.section-title { font-size: 18px; font-weight: 700; margin: 36px 0 16px; }
.exercise-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.ex-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-sm);
  transition: box-shadow .2s, border-color .2s, transform .2s;
}
.ex-card:not(.is-disabled):hover { box-shadow: var(--shadow); border-color: var(--primary-200); transform: translateY(-2px); }
.ex-card-top { display: flex; align-items: center; gap: 14px; }
.ex-card-icon {
  width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
  background: var(--primary-50); color: var(--primary);
}
.ex-card-icon .ico { width: 24px; height: 24px; }
.ex-card .eyebrow { color: var(--primary); }
.ex-card h2 { font-size: 19px; line-height: 1.3; margin-top: 2px; }
.ex-card p.desc { color: var(--muted); flex: 1; }
.ex-card-meta { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  padding: 3px 10px; border-radius: 999px; background: #f1f0f5; color: var(--ink-2);
}
.tag .ico { width: 14px; height: 14px; }
.tag--progress { background: var(--primary-50); color: var(--primary-700); }
.tag--done { background: var(--success-bg); color: var(--success); }
.tag--soon { background: #fff4e0; color: var(--warning); }
.ex-card.is-disabled { background: #fbfbfd; }
.ex-card.is-disabled .ex-card-icon { background: #f1f0f5; color: #7b768c; }
.ex-card-actions { display: flex; gap: 10px; align-items: center; }

/* =====================================================================
   EXERCISE LAYOUT
   ===================================================================== */
.instruction {
  background: linear-gradient(110deg, var(--primary-800) 0%, var(--primary) 100%);
  color: #fff; padding: 18px 24px;
}
.instruction-inner { display: flex; gap: 16px; align-items: flex-start; max-width: 1600px; margin: 0 auto; }
.instruction-icon {
  width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.14);
  display: grid; place-items: center; flex: none;
}
.instruction-icon .ico { width: 22px; height: 22px; }
.instruction h1 { font-size: 18px; font-weight: 700; }
.instruction p { color: #f3edff; margin-top: 4px; max-width: 1100px; }
.instruction-text { flex: 1; min-width: 0; }
.instruction .instruction-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #d9c8ff; margin: 0 0 2px; }
.part-tabs { display: flex; flex-direction: column; gap: 6px; flex: none; }
.part-tab {
  display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; border-radius: 10px;
  color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; line-height: 1.2;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); transition: background-color .15s;
}
.part-tab:hover { background: rgba(255,255,255,.18); }
.part-tab.is-current { background: #fff; color: var(--primary-700); border-color: #fff; }
.part-tab-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; opacity: .8; }
.part-tab-state { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.14); flex: none; }
.part-tab.is-current .part-tab-state { background: var(--primary-50); }
.part-tab-state .ico { width: 16px; height: 16px; }
.completed-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.completed-list li { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--success-bg); color: #0e5a2a; font-size: 15px; }
.completed-list li .ico { width: 22px; height: 22px; color: var(--success); }

.ex-layout {
  display: grid; grid-template-columns: minmax(0, 7fr) minmax(300px, 3fr); gap: 20px;
  padding: 20px 24px 24px; max-width: 1600px; margin: 0 auto; align-items: start;
}
.workspace { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; box-shadow: var(--shadow-sm);
}
.toolbar-spacer { flex: 1; }
.counter {
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2);
  padding: 6px 12px; border-radius: 999px; background: #f3f2f7; font-weight: 600;
}
.counter .ico { width: 16px; height: 16px; color: var(--primary); }
.counter strong { color: var(--primary-700); }
.check-wrap { display: flex; align-items: center; gap: 10px; }
.check-hint { font-size: 12px; color: var(--muted); max-width: 170px; line-height: 1.3; }
.segmented { display: inline-flex; padding: 3px; border-radius: 10px; background: #efedf5; gap: 2px; }
.segmented button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--primary-700); box-shadow: var(--shadow-sm); }
.segmented button:hover:not([aria-pressed="true"]) { color: var(--primary-700); }

.notice {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid; font-size: 14px;
}
.notice .ico { width: 20px; height: 20px; }
.notice p { flex: 1; }
.notice--warning { background: var(--warning-bg); border-color: var(--warning-line); color: #6b3404; }
.notice--success { background: var(--success-bg); border-color: #9fd8b2; color: #0e5a2a; }
.notice--correction { background: #ecfdf3; border-color: #86cfa0; color: #0e5a2a; }

/* =====================================================================
   CANVAS
   ===================================================================== */
.canvas {
  position: relative; overflow: hidden; border-radius: var(--radius);
  border: 1px solid var(--line); background-color: #fcfcfe;
  background-image: radial-gradient(circle, #d4cfe2 1.1px, transparent 1.2px);
  height: calc(100vh - var(--appbar-h) - 210px); min-height: 520px;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
  box-shadow: inset 0 1px 3px rgba(29,22,48,.04);
}
.canvas.is-panning { cursor: grabbing; }
.canvas.is-correction { background-color: #f7fcf9; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.edges .edge-hit { pointer-events: stroke; cursor: pointer; }
.edges path.edge { fill: none; stroke-width: 2.4; }
.edge--manual { stroke: var(--manual); }
.edge--automatic { stroke: var(--auto); }
.edge--unknown { stroke: #8f8aa3; stroke-dasharray: 6 5; }
.edge-badge {
  position: absolute; transform: translate(-50%, -50%); z-index: 3;
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px 0 6px;
  border-radius: 999px; font-size: 11px; font-weight: 700; border: 1.5px solid; background: #fff;
  cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-sm);
}
.edge-badge .ico { width: 13px; height: 13px; }
.edge-badge--manual { color: var(--manual); border-color: var(--manual); }
.edge-badge--automatic { color: var(--auto); border-color: var(--auto); }
.edge-badge--unknown { color: #5d5873; border-color: #a5a0b6; }
button.edge-badge:hover { background: #f7f6fb; }
span.edge-badge { cursor: default; }

.node { position: absolute; z-index: 2; }
.node:focus-visible { box-shadow: var(--focus); }
.node.is-dragging { z-index: 10; }
.node.is-dragging .card { box-shadow: var(--shadow-lg); }

/* Fixed blocks: start / AND / END */
.node--fixed {
  width: 220px; min-height: 56px; border-radius: 12px; color: #fff;
  background: linear-gradient(135deg, #6430cf 0%, var(--primary-700) 100%);
  display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 22px 12px 12px;
  font-weight: 700; font-size: 15.5px; white-space: nowrap; letter-spacing: .02em; box-shadow: var(--shadow); cursor: move;
}
.node--fixed .node-icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.16); }
.node--fixed .node-icon .ico { width: 18px; height: 18px; }
.node--fixed .lock { position: absolute; right: 8px; top: 6px; opacity: .65; }
.node--fixed .lock .ico { width: 12px; height: 12px; }
.node--and .node-icon .ico { transform: rotate(180deg); }
.ports { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
.ports--top { top: 0; }
.ports--bottom { bottom: 0; }
.port {
  position: absolute; width: 10px; height: 10px; border-radius: 50%; transform: translate(-50%, -50%);
  background: #fff; border: 2px solid var(--primary-700);
}
.port.is-used { background: var(--primary-200); }

/* Action cards */
.node--action { width: 260px; cursor: move; }
.card {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px;
  box-shadow: var(--shadow); overflow: hidden; border-top: 4px solid #b9b4c8;
  transition: box-shadow .15s, border-color .15s;
}
.node--action:hover .card { border-color: var(--primary-200); }
.node--action.in-manual .card { border-top-color: var(--manual); }
.node--action.in-automatic .card { border-top-color: var(--auto); }
.node--action.is-isolated .card { border-style: dashed; border-top-style: solid; background: #fdfcff; }
.node--action.has-issue .card { border-color: var(--warning-line); box-shadow: 0 0 0 3px #ffe2b3, var(--shadow); }
.node--fixed.has-issue { box-shadow: 0 0 0 4px #ffc56b, var(--shadow); }
.card-head { display: flex; align-items: center; gap: 6px; padding: 8px 8px 0 12px; min-height: 38px; }
.incoming {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700;
  padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em;
}
.incoming .ico { width: 12px; height: 12px; }
.incoming--manual { background: var(--manual-bg); color: var(--manual); }
.incoming--automatic { background: var(--auto-bg); color: var(--auto); }
.incoming--none { background: #f1f0f5; color: var(--muted); }
.incoming--required { background: var(--primary-50); color: var(--primary-700); }
.card-tools { margin-left: auto; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.node--action:hover .card-tools, .node--action:focus-within .card-tools, .node--action:focus .card-tools { opacity: 1; }
@media (hover: none) { .card-tools { opacity: 1; } }
.card-title { padding: 4px 12px 8px; font-weight: 700; font-size: 14.5px; line-height: 1.35; color: var(--ink); word-break: break-word; }
.card-title.is-empty { color: var(--danger); font-style: italic; font-weight: 600; }
.card-meta { list-style: none; margin: 0; padding: 8px 12px 10px; display: grid; gap: 6px; border-top: 1px solid #efedf4; background: #fbfafd; }
.card-meta li { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.card-meta li span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta-ico {
  width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; flex: none;
  background: var(--primary-50); color: var(--primary);
}
.meta-ico .ico { width: 14px; height: 14px; }
.meta-ico--app { background: #eef2ff; color: #3343a8; }
.meta-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; width: 34px; flex: none; }
.card-issue {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600;
  background: var(--warning-bg); color: #7a3a04; border-top: 1px solid #f6d29e;
}
.card-issue .ico { width: 14px; height: 14px; }
.card-status { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; border-top: 1px solid; }
.card-status .ico { width: 14px; height: 14px; }
.card-status--ok { background: var(--success-bg); color: var(--success); border-color: #bfe5cb; }
.card-status--partial { background: var(--warning-bg); color: #7a3a04; border-color: #f6d29e; }
.card-status--missing { background: #fdecec; color: var(--danger); border-color: #f6c4c4; }
.node--expected .card { border-color: #7fcf9b; border-style: solid; }
.node--expected .card-head .expected-tag {
  font-size: 11px; font-weight: 700; color: var(--success); text-transform: uppercase; letter-spacing: .04em; margin-left: auto; padding-right: 4px;
}
.node--readonly { cursor: default; }

/* Handles under nodes */
.handle { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; margin-top: 14px; z-index: 4; }
.handle--round { margin-top: 0; transform: translate(-50%, -50%); }
.handle--side { left: 100%; top: 50%; transform: translateY(-50%); margin: 0 0 0 16px; flex-direction: column; align-items: flex-start; gap: 6px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px 0 10px; border-radius: 999px;
  background: var(--surface); color: var(--primary-700); border: 1.5px dashed var(--primary-200);
  font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-sm);
  transition: background-color .15s, border-color .15s;
}
.pill:hover { background: var(--primary-50); border-color: var(--primary); border-style: solid; }
.pill[aria-disabled="true"] { color: #6f6a82; border-color: #d3cfdf; background: #f6f5f9; }
.pill .ico { width: 16px; height: 16px; }
.pill-count { font-size: 11px; background: var(--primary-50); color: var(--primary-700); padding: 1px 6px; border-radius: 999px; }
.round-btn {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  background: var(--surface); color: var(--primary); border: 2px solid var(--primary); cursor: pointer;
  box-shadow: var(--shadow-sm); transition: background-color .15s, color .15s, transform .15s;
}
.round-btn .ico { width: 14px; height: 14px; }
.round-btn:hover { background: var(--primary); color: #fff; transform: scale(1.08); }
.link-btn {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  background: var(--surface); color: var(--ink-2); border: 1px solid var(--line-2); cursor: pointer; box-shadow: var(--shadow-sm);
}
.link-btn:hover { color: var(--primary-700); border-color: var(--primary-200); background: var(--primary-50); }
.link-btn .ico { width: 15px; height: 15px; }
.and-hint { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.and-hint .ico { width: 13px; height: 13px; }
.handle-row { display: flex; gap: 6px; align-items: center; }

/* Canvas overlays */
.canvas-controls {
  position: absolute; left: 12px; bottom: 12px; z-index: 6; display: flex; align-items: center; gap: 2px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: var(--shadow);
}

/* =====================================================================

    if (!layer) return;

      const desired = parents.length ? parents.reduce((s, v) => s + v, 0) / parents.length : CENTER_X;

function parentCandidates(nodeId) {
  const descendants = nodeId ? reachable(nodeId) : new Set();
  const current = nodeId ? inEdges(nodeId)[0] : null;
  return Object.values(S.nodes).filter(n => {
    if (n.type !== 'action' && n.type !== 'and') return false;
    if (n.id === nodeId || descendants.has(n.id)) return false;
    if (n.type === 'and' && outEdges('and').length >= MAX_BRANCHES && !(current && current.from === 'and')) return false;
    return true;
  }).sort((a, b) => a.y - b.y || a.x - b.x);
}

function ensureCustomApp(label) {
  const existing = allApps().find(a => normalize(a.label) === normalize(label));
  if (existing) return existing.id;
  const id = 'custom-' + (normalize(label).replace(/\s+/g, '-') || 'app') + '-' + (S.seq++);
  S.customApps.push({ id, label, icon: 'package', custom: true });
  return id;
}
function newId(prefix) { return prefix + (S.seq++); }

/* Where to place a new action (below its parent, without overlapping). */
function placeNew(parentId) {
  const size = { w: DEFAULT_SIZE.action.w, h: DEFAULT_SIZE.action.h + 56 }, GAP = 60; // + room for the handle under the card
  const nodes = Object.values(S.nodes);
  const rect = n => { const s = sizeOf(n); return { x: n.x, y: n.y, w: s.w + (n.type === 'and' ? 240 : 0), h: s.h + (n.type === 'end' ? 0 : 56) }; };
  const overlaps = (r, q, m) => r.x < q.x + q.w + m && r.x + r.w + m > q.x && r.y < q.y + q.h + m && r.y + r.h + m > q.y;
  if (!parentId) {
    const maxRight = Math.max(...nodes.map(n => n.x + sizeOf(n).w));
    return { x: snap(maxRight + 120), y: 160 };
  }
  const p = S.nodes[parentId], ps = sizeOf(p);
  const pcx = p.x + ps.w / 2, y = snap(p.y + ps.h + 96);
  for (const o of [0, 300, -300, 600, -600, 900, -900]) {
    const cand = { x: snap(pcx + o - size.w / 2), y, w: size.w, h: size.h };
    const blocking = nodes.filter(n => overlaps(cand, rect(n), 24));
    if (blocking.some(n => n.y <= y + 10)) continue;
    if (blocking.length) {
      const top = Math.min(...blocking.map(n => n.y));
      const shift = snap(cand.y + cand.h + GAP - top);
      nodes.forEach(n => { if (n.y >= top - 1) n.y += shift; });
    }
    return { x: cand.x, y };
  }
  return { x: snap(pcx - size.w / 2 + 1200), y };
}

      $$('input[name="cmode"]', root).forEach(r => r.addEventListener('change', sync));

async function deleteAction(id) {
  const n = S.nodes[id];
  if (!n || n.type !== 'action') return;
  if (n.required) { toast(MSG.required, 'error'); return; }
  const children = outEdges(id).map(e => S.nodes[e.to]).filter(c => c.type === 'action');
  let choice;
  if (!children.length) {
    choice = await confirmDialog('Delete action', 'Are you sure you want to delete this action?<br><strong>' + esc(nodeLabel(n)) + '</strong>', 'Delete action', 'danger') ? 'single' : null;
  } else {
    choice = await openDialog({
      title: 'Delete action', icon: 'trash', tone: 'danger',
      body: '<p>Are you sure you want to delete this action?</p>' +
        '<p class="context-line">' + icon('workflow') + '<span><strong>' + esc(nodeLabel(n)) + '</strong> is followed by ' + children.length + ' action' + (children.length > 1 ? 's' : '') + '.</span></p>' +
        '<p>What should happen to the following actions?</p>',
      actions: [
        { label: 'Cancel', value: null },
        { label: 'Delete and detach the next actions', value: 'single', variant: 'secondary' },
        { label: 'Delete with all next actions', value: 'cascade', variant: 'danger' }
      ]
    });
  }
  if (!choice) return;
  const toDelete = new Set([id]);
  if (choice === 'cascade') {
    const stack = [id];
    while (stack.length) {
      const cur = stack.pop();
      outEdges(cur).forEach(e => { const t = S.nodes[e.to]; if (t.type === 'action' && !t.required && !toDelete.has(t.id)) { toDelete.add(t.id); stack.push(t.id); } });
    }
  }
  toDelete.forEach(d => { delete S.nodes[d]; clearIssues(d); });
  S.edges = S.edges.filter(e => !toDelete.has(e.from) && !toDelete.has(e.to));
  commit();
  toast(toDelete.size > 1 ? toDelete.size + ' actions deleted.' : 'Action deleted.');
}
function clearIssues(id) {
  if (S.feedback && S.feedback.nodes && S.feedback.nodes[id]) delete S.feedback.nodes[id];
}

function buildCorrectionGraph() {
  const res = grade();
  const nodes = {
    start: { id: 'start', type: 'start', x: 0, y: 0, readonly: true },
    and: { id: 'and', type: 'and', x: 0, y: 0, readonly: true },
    end: { id: 'end', type: 'end', x: 0, y: 0, readonly: true }

  const key = ref => ref === 'START' ? 'start' : ref === 'AND' ? 'and' : 'step:' + ref;
  const edges = [];
  CORR.steps.forEach(s => {
    const app = Array.isArray(s.application) ? s.application[0] : s.application;
    const doer = Array.isArray(s.doer) ? s.doer[0] : s.doer;
    nodes['step:' + s.id] = { id: 'step:' + s.id, type: 'action', x: 0, y: 0, name: s.name, doer, app, expected: true, status: res.stepState[s.id], readonly: true };
    if (s.parent) edges.push({ id: 'ce-' + s.id, from: key(s.parent), to: 'step:' + s.id, type: s.transition || null });
  });
  if (CORR.andNode && CORR.andNode.parent) edges.push({ id: 'ce-and', from: key(CORR.andNode.parent), to: 'and', type: CORR.andNode.transition || null });
  CORR.steps.forEach(s => {
    const leaf = !CORR.steps.some(o => o.parent === s.id) && !(CORR.andNode && CORR.andNode.parent === s.id);
    if (s.transitionToEnd || (leaf && s.position === 'after-and')) edges.push({ id: 'ce-end-' + s.id, from: 'step:' + s.id, to: 'end', type: s.transitionToEnd || null });
  });

}

  let handle = '';
  if (!ro) {
    handle = outs ?
      '<div class="handle handle--round"><button type="button" class="round-btn" data-act="connect" data-id="' + esc(n.id) + '" data-key="link:' + esc(n.id) + '" aria-label="Add a connection from ' + esc(name) + '" title="Add a connection">' + icon('plus') + '</button></div>' :
      '<div class="handle"><button type="button" class="pill" data-act="add-after" data-id="' + esc(n.id) + '" data-key="add:' + esc(n.id) + '" aria-label="Add an action after ' + esc(name) + '">' + icon('plus') + 'Add an action</button>' +
      '<button type="button" class="link-btn" data-act="connect" data-id="' + esc(n.id) + '" data-key="link:' + esc(n.id) + '" aria-label="Connect ' + esc(name) + ' to an existing step or choose a transition" title="Connect to an existing step (e.g. END)">' + icon('link') + '</button></div>';
  }
  const aria = 'Action: ' + name + '. Doer: ' + (doer ? doer.label : 'not set') + '. Application: ' + (app ? app.label : (n.app || 'not set')) + '. ' +
    (ins.length && inType !== 'unknown' ? 'Incoming transition: ' + transLabel(inType) + '. ' : ins.length ? '' : 'Not connected. ') + (issues.length ? 'To review: ' + issues.join(' ') : '');
  return '<div class="node node--action' + (inType ? ' in-' + inType : '') + (isolated ? ' is-isolated' : '') + (issues.length ? ' has-issue' : '') + (n.expected ? ' node--expected' : '') + (ro ? ' node--readonly' : '') + '" ' + common + ' role="group" aria-label="' + esc(aria) + '">' +
    '<div class="card"><div class="card-head">' + inChip + tools + '</div>' +
    '<p class="card-title">' + esc(name) + '</p>' +
    '<ul class="card-meta">' +
      '<li><span class="meta-ico">' + icon(doer ? doer.icon : 'user') + '</span><span class="meta-label">Doer</span><span class="txt">' + esc(doer ? doer.label : 'Not set') + '</span></li>' +
      '<li><span class="meta-ico meta-ico--app">' + icon(app ? app.icon : 'package') + '</span><span class="meta-label">App</span><span class="txt">' + esc(app ? app.label : (n.app || 'Not set')) + '</span></li>' +
    '</ul>' + footer + '</div>' + handle + '</div>';
}

function edgeGeometry(e, g) {
  const a = g.nodes[e.from], b = g.nodes[e.to];
  if (!a || !b) return null;
  const sa = sizeOf(a), sb = sizeOf(b);
  const cx = n => n.x + sizeOf(n).w / 2;
  const outs = outEdges(a.id, g).slice().sort((p, q) => cx(g.nodes[p.to]) - cx(g.nodes[q.to]));
  const i = outs.indexOf(e), k = outs.length;
  let sx;
  if (a.type === 'and') { const slots = k === 1 ? [.5] : k === 2 ? [.25, .75] : [.25, .5, .75]; sx = a.x + sa.w * (slots[i] != null ? slots[i] : .5); }
  else sx = a.x + sa.w * (i + 1) / (k + 1);
  const sy = a.y + sa.h;
  const ins = inEdges(b.id, g).slice().sort((p, q) => cx(g.nodes[p.from]) - cx(g.nodes[q.from]));
  const j = ins.indexOf(e), m = ins.length;
  const tx = b.x + sb.w * (j + 1) / (m + 1), ty = b.y - 2;
  let d, mid;
  if (ty - sy > 40) {
    const dy = Math.max(36, (ty - sy) / 2);
    d = 'M' + sx + ',' + sy + ' C' + sx + ',' + (sy + dy) + ' ' + tx + ',' + (ty - dy) + ' ' + tx + ',' + ty;
    mid = { x: (sx + 3 * sx + 3 * tx + tx) / 8, y: (sy + 3 * (sy + dy) + 3 * (ty - dy) + ty) / 8 };
  } else {
    // Target above (or level with) the source: route around on the right.
    const ox = Math.max(a.x + sa.w, b.x + sb.w) + 48;
    const y1 = sy + 24, y2 = ty - 24;
    d = 'M' + sx + ',' + sy + ' L' + sx + ',' + y1 + ' L' + ox + ',' + y1 + ' L' + ox + ',' + y2 + ' L' + tx + ',' + y2 + ' L' + tx + ',' + ty;
    mid = { x: ox, y: (y1 + y2) / 2 };
  }
  return { d, mid };
}
function renderEdges() {
  const g = currentGraph();
  let paths = '', badges = '';
  g.edges.forEach(e => {
    const geo = edgeGeometry(e, g);
    if (!geo) return;
    const t = e.type || 'unknown';
    const label = e.type ? transLabel(e.type) : 'Transition not specified';
    const desc = label + ': ' + nodeLabel(g.nodes[e.from]) + ' to ' + nodeLabel(g.nodes[e.to]);
    paths += '<path class="edge edge--' + t + '" d="' + geo.d + '" marker-end="url(#arrow-' + t + ')"><title>' + esc(desc) + '</title></path>';
    if (!g.readonly) paths += '<path class="edge-hit" data-edge-id="' + esc(e.id) + '" d="' + geo.d + '" stroke="transparent" stroke-width="14" fill="none"><title>' + esc(desc) + ' – click to edit</title></path>';
    const inner = icon(e.type ? transIcon(e.type) : 'info') + '<span>' + esc(e.type ? transShort(e.type) : '?') + '</span>';
    badges += g.readonly
      ? '<span class="edge-badge edge-badge--' + t + '" style="left:' + geo.mid.x + 'px;top:' + geo.mid.y + 'px" role="img" aria-label="' + esc(desc) + '" title="' + esc(label) + '">' + inner + '</span>'
      : '<button type="button" class="edge-badge edge-badge--' + t + '" style="left:' + geo.mid.x + 'px;top:' + geo.mid.y + 'px" data-act="edge" data-edge-id="' + esc(e.id) + '" data-key="edge:' + esc(e.id) + '" aria-label="' + esc(desc) + '. Edit connection" title="' + esc(label) + ' – click to edit">' + inner + '</button>';
  });
  edgesEl.innerHTML = paths;
  badgesEl.innerHTML = badges;
}

/* =====================================================================
   15. VIEW: PAN / ZOOM / FIT
   ===================================================================== */
let view = { x: 0, y: 0, z: 1 };
let viewSaveTimer = null;
function applyView(v) {
  if (v) view = v; else if (UI.mode !== 'correction' && S.view) view = S.view;
  worldEl.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.z + ')';
  canvasEl.style.backgroundSize = (GRID * view.z) + 'px ' + (GRID * view.z) + 'px';
  canvasEl.style.backgroundPosition = view.x + 'px ' + view.y + 'px';
  $('#zoom-label').textContent = Math.round(view.z * 100) + '%';
  if (UI.mode !== 'correction') {
    S.view = Object.assign({}, view);
    clearTimeout(viewSaveTimer); viewSaveTimer = setTimeout(saveState, 300);
  }
}
function contentBox() {
  const g = currentGraph();
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  Object.values(g.nodes).forEach(n => {
    const s = sizeOf(n);
    const extraR = n.type === 'and' && !g.readonly ? 230 : 0;
    const extraB = n.type !== 'end' && !g.readonly ? 52 : 0;
    x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
    x2 = Math.max(x2, n.x + s.w + extraR); y2 = Math.max(y2, n.y + s.h + extraB);
  });
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}
function fitView(maxOne) {
  const b = contentBox(), r = canvasEl.getBoundingClientRect();
  const pad = 56;
  // Keep the text readable: below 55 % the view is aligned to the top and the participant can pan.
  const z = clamp(Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2 - 40) / b.h), 0.55, maxOne === false ? 1.2 : 1);
  applyView({ z, x: (r.width - b.w * z) / 2 - b.x * z, y: Math.max(pad / 2, (r.height - 40 - b.h * z) / 2) - b.y * z });
}
function resetView() {
  const b = contentBox(), r = canvasEl.getBoundingClientRect();
  applyView({ z: 1, x: r.width / 2 - (b.x + b.w / 2), y: 32 - b.y });
}
function zoomAt(factor, px, py) {
  const r = canvasEl.getBoundingClientRect();
  if (px == null) { px = r.width / 2; py = r.height / 2; }
  const nz = clamp(view.z * factor, 0.3, 2);
  const wx = (px - view.x) / view.z, wy = (py - view.y) / view.z;
  applyView({ z: nz, x: px - wx * nz, y: py - wy * nz });
}
function ensureVisible(id) {
  const n = S.nodes[id]; if (!n) return;
  const s = sizeOf(n), r = canvasEl.getBoundingClientRect();
  const left = n.x * view.z + view.x, top = n.y * view.z + view.y;
  const right = left + s.w * view.z, bottom = top + (s.h + 60) * view.z;
  let dx = 0, dy = 0;
  if (left < 20) dx = 20 - left; else if (right > r.width - 20) dx = r.width - 20 - right;
  if (top < 20) dy = 20 - top; else if (bottom > r.height - 60) dy = r.height - 60 - bottom;
  if (dx || dy) applyView({ z: view.z, x: view.x + dx, y: view.y + dy });
}
function locateNode(id) {
  const n = S.nodes[id]; if (!n) return;
  const s = sizeOf(n), r = canvasEl.getBoundingClientRect();
  applyView({ z: view.z, x: r.width / 2 - (n.x + s.w / 2) * view.z, y: r.height / 2 - (n.y + s.h / 2) * view.z });
  canvasEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const el = $('[data-key="node:' + id + '"]');
  if (el) el.focus({ preventScroll: true });
}

/* =====================================================================
   16. CANVAS INTERACTIONS (drag, pan, wheel, keyboard, clicks)
   ===================================================================== */
function bindCanvas() {
  let drag = null;
  canvasEl.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    if (ev.target.closest('button, a, input, select, .canvas-controls, .canvas-hint')) return;
    const nodeEl = ev.target.closest('.node');
    const g = currentGraph();
    if (nodeEl && !g.readonly) {
      const n = S.nodes[nodeEl.dataset.id];
      drag = { kind: 'node', id: n.id, el: nodeEl, sx: ev.clientX, sy: ev.clientY, ox: n.x, oy: n.y, moved: false };
    } else {
      drag = { kind: 'pan', sx: ev.clientX, sy: ev.clientY, ox: view.x, oy: view.y, moved: false };
      canvasEl.classList.add('is-panning');
    }
    canvasEl.setPointerCapture(ev.pointerId);
  });
  canvasEl.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    drag.moved = true;
    if (drag.kind === 'pan') { applyView({ z: view.z, x: drag.ox + dx, y: drag.oy + dy }); return; }
    const n = S.nodes[drag.id];
    n.x = snap(drag.ox + dx / view.z); n.y = snap(drag.oy + dy / view.z);
    drag.el.style.left = n.x + 'px'; drag.el.style.top = n.y + 'px';
    drag.el.classList.add('is-dragging');
    renderEdges();
  });
  const end = ev => {
    if (!drag) return;
    if (drag.kind === 'node') {
      drag.el.classList.remove('is-dragging');
      if (drag.moved) saveState(); else drag.el.focus({ preventScroll: true });
    }
    canvasEl.classList.remove('is-panning');
    try { canvasEl.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
    drag = null;
  };
  canvasEl.addEventListener('pointerup', end);
  canvasEl.addEventListener('pointercancel', end);
  canvasEl.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = canvasEl.getBoundingClientRect();
    if (ev.ctrlKey || ev.metaKey) zoomAt(Math.exp(-ev.deltaY * 0.0022), ev.clientX - r.left, ev.clientY - r.top);
    else applyView({ z: view.z, x: view.x - ev.deltaX, y: view.y - ev.deltaY });
  }, { passive: false });
  canvasEl.addEventListener('keydown', ev => {
    const nodeEl = ev.target.classList && ev.target.classList.contains('node') ? ev.target : null;
    if (!nodeEl || currentGraph().readonly) return;
    const n = S.nodes[nodeEl.dataset.id];
    const step = ev.shiftKey ? 50 : SNAP;
    const moves = { ArrowUp: [0, -step], ArrowDown: [0, step], ArrowLeft: [-step, 0], ArrowRight: [step, 0] };
    if (moves[ev.key]) {
      ev.preventDefault();
      n.x = snap(n.x + moves[ev.key][0]); n.y = snap(n.y + moves[ev.key][1]);
      nodeEl.style.left = n.x + 'px'; nodeEl.style.top = n.y + 'px';
      renderEdges(); ensureVisible(n.id); saveState();
    } else if (ev.key === 'Enter' && n.type === 'action') { ev.preventDefault(); openActionModal({ mode: 'edit', nodeId: n.id }); }
    else if ((ev.key === 'Delete' || ev.key === 'Backspace') && n.type === 'action') { ev.preventDefault(); deleteAction(n.id); }
  });
  edgesEl.addEventListener('click', ev => { const p = ev.target.closest('[data-edge-id]'); if (p) openEdgeModal(p.dataset.edgeId); });
  window.addEventListener('resize', () => { if (inExercise() && canvasEl.isConnected) applyView(); });
}
async function onExerciseClick(ev) {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case 'add-after': addAfter(id); break;
    case 'connect': openConnectModal(id); break;
    case 'edit': openActionModal({ mode: 'edit', nodeId: id }); break;
    case 'delete': deleteAction(id); break;
    case 'edge': openEdgeModal(b.dataset.edgeId); break;
    case 'zoom-in': zoomAt(1.2); break;
    case 'zoom-out': zoomAt(1 / 1.2); break;
    case 'fit': fitView(); break;
    case 'reset-view': resetView(); break;
    case 'arrange': {
      const pos = layeredLayout(S, sizeOf);
      Object.keys(pos).forEach(k => { S.nodes[k].x = pos[k].x; S.nodes[k].y = pos[k].y; });
      commit(); fitView(); toast('Workflow tidied up.');
      break;
    }
    case 'check': checkAnswer(); break;
    case 'feedback': showFeedback(); break;
    case 'mode-correction': setMode('correction'); break;
    case 'mode-mine': setMode('mine'); break;
    case 'reset': {
      const ok = await confirmDialog('Reset exercise', 'Are you sure you want to reset <strong>' + esc(PART.label + ' – ' + PART.title) + '</strong>? Your workflow, custom applications and attempts for this part will be deleted. The other part is not affected. This cannot be undone.', 'Reset exercise', 'danger');
      if (!ok) return;
      S = initialState(); UI.mode = 'mine'; UI.correction = null;
      saveState(); renderExercise('tb:reset'); resetView();
      toast('The exercise has been reset.');
      break;
    }
  }
}

/* =====================================================================
   17. BOOT
   ===================================================================== */
$('#brand-mark').innerHTML = icon('shield');
if (!CFG) {
  main.innerHTML = '<div class="fatal"><h1>Configuration missing</h1><p>The file <code>config.js</code> could not be loaded. Make sure it is located next to <code>index.html</code>.</p></div>';
  return;
}
window.addEventListener('hashchange', route);
route();
})();
</script>
